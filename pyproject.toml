[project]
name = "saarige"
version = "0.1.0"
description = "Agentic commute planner for Bengaluru (metro + BMTC + auto)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
